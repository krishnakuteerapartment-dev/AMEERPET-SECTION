/* ---------- section data: built in, saved on this phone, or loaded from a file ----------
   Public copies of this app carry no consumer data. Staff load the section data file (or the Service Mapping Excel) once per phone;
   it is kept in this browser's storage (IndexedDB) and never uploaded. */
const IDB={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('yrguda-dtr',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
async function gunzipB64(b64){const raw=atob(b64);const bin=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bin[i]=raw.charCodeAt(i);
  return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function gzipB64(txt){const buf=new Uint8Array(await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(s)}
async function embeddedParts(){
  const b=$('masterdata').textContent.trim();if(!b||b.startsWith('__'))return null;
  return{txt:await gunzipB64(b),STR:JSON.parse($('structdata').textContent),AR:JSON.parse($('areadata').textContent),meta:{mapOn:'17-Oct-2026',masterOn:'16-Oct-2026',src:'Built into this page'}};
}
async function importDataFile(file){
  try{const j=JSON.parse(await file.text());
    if(j.app!=='yrguda-dtr'||!j.records||!j.structs||!j.areas)throw new Error('not a section data file');
    const P={txt:await gunzipB64(j.records),STR:j.structs,AR:j.areas,meta:Object.assign({},j.meta,{src:'File: '+file.name,loaded:Date.now()})};
    await IDB.set('section',P);toast('Section data loaded');setTimeout(()=>location.reload(),600);
  }catch(e){toast('That file is not a section data file. Use the .json file you were given.')}
}
let xlsxLoading=null;
function loadXlsxLib(){return xlsxLoading||(xlsxLoading=new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=()=>{xlsxLoading=null;rej(new Error('Could not load the Excel reader. Check the internet connection.'))};document.head.appendChild(s)}))}
async function importExcel(file){
  toast('Reading Excel…');
  try{
    await loadXlsxLib();
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}).map(r=>{const o={};for(const k in r)o[k.trim().toUpperCase()]=r[k];return o});
    const need=['STRUCTURE CODE','UKSCNO','SERVICE NO'];
    if(!rows.length||need.some(k=>!(k in rows[0])))throw new Error('This is not the Service Mapping Excel (needs Structure Code, UKSCNO and Service No columns).');
    const cl=v=>String(v==null?'':v).replace(/[\t\n\r]+/g,' ').trim();
    const STR={},AR={},out=[],seen=new Set();
    for(const r of rows){
      const u=cl(r['UKSCNO']).replace(/\.0+$/,'');if(!u||seen.has(u))continue;seen.add(u);
      const code=cl(r['STRUCTURE CODE']).replace(/\.0+$/,'');const o=S.byU.get(u)||{};
      if(!STR[code])STR[code]=[cl(r['STRUCTURE NAME']),cl(r['STRUCTURE TYPE']),cl(r['FEEDER NAME']),cl(r['FEEDER CODE']).replace(/\.0+$/,'')];
      const ac=cl(r['AREA CODE']).replace(/\.0+$/,''),an=cl(r['AREA NAME']);
      if(ac){if(!AR[ac])AR[ac]=[an,{}];AR[ac][1][code]=(AR[ac][1][code]||0)+1}
      let addr=cl(r['ADDRESS']);if(!addr.replace(/[\W_]+/g,''))addr=o.a||'';
      out.push([cl(r['SERVICE NO']),u,o.m||'0',code,cl(r['CONSUMER NAME'])||o.n||'',addr,o.ph||1,o.ct||'',o.ld||0,o.mk||'',o.r||0,o.rm||'',o.sl||'',o.st||'',o.mf||1,an,0]);
    }
    let kept=0;for(const o of S.recs)if(!seen.has(o.u)){kept++;out.push(F.map(k=>k==='x'?1:o[k]))}
    const missing=out.filter(r=>!r[16]&&r[2]==='0').length;
    const today=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');
    const P={txt:out.map(r=>r.join('\t')).join('\n'),STR,AR,meta:{mapOn:today,masterOn:(S.meta&&S.meta.masterOn)||'not loaded',src:'Excel: '+file.name,loaded:Date.now(),noMeter:missing}};
    await IDB.set('section',P);
    toast(`Loaded ${fmt(seen.size)} services${missing?`, ${fmt(missing)} without meter number`:''}`);setTimeout(()=>location.reload(),900);
  }catch(e){toast(e.message||'Could not read that Excel file')}
}

/* ---------- sign in ----------
   Logins are kept on this phone. Passwords are stored only as salted SHA-256 hashes.
   Default: user "admin", password 123456 (change it after the first sign-in). The admin adds staff logins.
   This locks the app on a shared phone; it is not server security, because the code runs on the phone. */
function sha256(ascii){ // compact SHA-256 over a byte string (works without crypto.subtle)
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  const mw=Math.pow(2,32);let res='',i,j;const words=[],bl=ascii.length*8;
  let hash=sha256.h=sha256.h||[];const k=sha256.k=sha256.k||[];let pc=k.length;const comp={};
  for(let c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(Math.pow(c,.5)*mw)|0;k[pc++]=(Math.pow(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=((bl/mw)|0);words[words.length]=bl;
  for(j=0;j<words.length;){const w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}
  return res;
}
const utf8=s=>unescape(encodeURIComponent(s));
const AUTH_KEY='yrg_users_v1',SESS_KEY='yrg_session_v1',LOCK_KEY='yrg_lock_v1';
const DEFAULT_ADMIN={role:'admin',salt:'yrg-dtr',hash:'3097cb6ae9ac91b38f739bd3f503240f0678e1e86a83ae11144de5e36032d02c',def:1}; // admin / 123456
const Auth={
  users(){try{const u=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(u&&u.admin)return u}catch(e){}return{admin:Object.assign({},DEFAULT_ADMIN)}},
  save(u){try{localStorage.setItem(AUTH_KEY,JSON.stringify(u));return true}catch(e){toast('Could not save on this phone');return false}},
  hash(salt,name,pw){return sha256(utf8(salt+':'+name+':'+pw))},
  check(name,pw){const u=this.users()[name];return u&&this.hash(u.salt,name,pw)===u.hash?u:null},
  session(){try{const s=JSON.parse(localStorage.getItem(SESS_KEY)||'null');const u=s&&this.users()[s.name];
    if(u&&Date.now()-s.t<12*3600e3)return{name:s.name,role:u.role,t:s.t}}catch(e){}return null},
  begin(name){try{localStorage.setItem(SESS_KEY,JSON.stringify({name,t:Date.now()}));localStorage.setItem('yrg_last_user',name)}catch(e){}},
  end(){try{localStorage.removeItem(SESS_KEY)}catch(e){}},
  setPassword(name,pw,role){const u=this.users();const salt=Math.random().toString(36).slice(2,12);
    u[name]={role:role||(u[name]&&u[name].role)||'staff',salt,hash:this.hash(salt,name,pw)};return this.save(u)},
  remove(name){const u=this.users();if(name==='admin')return false;delete u[name];return this.save(u)},
  lock(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{"n":0,"until":0}')}catch(e){return{n:0,until:0}}},
  setLock(l){try{localStorage.setItem(LOCK_KEY,JSON.stringify(l))}catch(e){}}
};
const validName=n=>/^[a-z0-9._-]{2,20}$/.test(n);
function showLogin(msg){
  document.querySelector('.tabs').hidden=true;$('userPill').hidden=true;$('storeBadge').textContent='Signed out';
  $('hdr').innerHTML='YRG DTR Verify<small>Sec 10 Yella Reddy Guda · ERO 11</small>';
  let last='';try{last=localStorage.getItem('yrg_last_user')||''}catch(e){}
  main.innerHTML=`<section class="card stack login" aria-label="Sign in">
    <div class="brand">${I.qr}<div><b>YRG DTR Verify</b><span>DTR, feeder and area verification</span></div></div>
    <h2>Sign in</h2>
    <form id="lgForm" class="stack" autocomplete="on">
      <div><label class="lbl" for="lgUser">User name</label><input class="inp" id="lgUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="${h(last)}" placeholder="admin"></div>
      <div><label class="lbl" for="lgPw">Password</label><input class="inp" id="lgPw" name="password" type="password" autocomplete="current-password"></div>
      <p class="small" id="lgErr" role="alert" style="color:var(--bad);margin:0" ${msg?'':'hidden'}>${h(msg||'')}</p>
      <button class="btn primary big" id="lgBtn" type="submit">Sign in</button>
    </form>
    <p class="hint">Staff logins are created by the admin on this phone.</p>
  </section>`;
  const f=$('lgForm'),err=$('lgErr');
  (last?$('lgPw'):$('lgUser')).focus();
  f.onsubmit=e=>{e.preventDefault();
    const L=Auth.lock();if(L.until>Date.now()){err.hidden=false;err.textContent=`Too many wrong tries. Wait ${Math.ceil((L.until-Date.now())/1000)} seconds.`;return}
    const name=$('lgUser').value.trim().toLowerCase(),pw=$('lgPw').value;
    if(!name||!pw){err.hidden=false;err.textContent='Enter your user name and password.';return}
    const u=Auth.check(name,pw);
    if(!u){const n=L.n+1;Auth.setLock({n:n>=5?0:n,until:n>=5?Date.now()+30000:0});err.hidden=false;err.textContent=n>=5?'Too many wrong tries. Wait 30 seconds.':'Wrong user name or password.';$('lgPw').value='';$('lgPw').focus();return}
    Auth.setLock({n:0,until:0});Auth.begin(name);startApp();
    if(u.def)setTimeout(()=>toast('You are using the default admin password. Change it in Guide → Account.'),1200);
  };
}

function bindAccount(){
  const so=$('soBtn');if(so)so.onclick=signOut;
  const pf=$('pwForm');if(pf)pf.onsubmit=e=>{e.preventDefault();const o=$('pwOld').value,n=$('pwNew').value,n2=$('pwNew2').value;

  const af=$('addForm');if(af)af.onsubmit=e=>{e.preventDefault();const n=$('nuName').value.trim().toLowerCase(),pw=$('nuPw').value,r=$('nuRole').value;

  main.querySelectorAll('[data-udel]').forEach(b=>b.onclick=()=>{if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Tap again';return}if(Auth.remove(b.dataset.udel)){toast('Removed');vGuide()}});

    box.innerHTML=`<input class="inp" type="password" autocomplete="new-password" placeholder="New password for ${h(n)}" style="flex:1;min-width:0"><button class="btn sm" type="submit">Save</button>`;
    b.closest('.drow').appendChild(box);b.remove();box.querySelector('input').focus();
    box.onsubmit=e=>{e.preventDefault();const pw=box.querySelector('input').value;if(pw.length<6){toast('At least 6 characters');return}if(Auth.setPassword(n,pw)){toast('Password reset for '+n);vGuide()}}});
}

/* Android back button: close an open panel or decision first, then go back to Services, then leave the app */
function bindBackButton(){
  const App=capPlugin('App');if(!App||!App.addListener)return;
  App.addListener('backButton',()=>{
    if(S.pending){S.pending=null;return showResult()}
    if(S.fpending){S.fpending=null;return showF()}
    if(S.apending){S.apending=null;return showA()}
    if(cam.stream||cam.timer){stopCam();S.panel=null;S.fpanel=null;S.apanel=null;return go(S.view)}
    if(S.view!=='verify'&&S.ready)return go('verify');
    App.exitApp();
  });
}

/* ---------- start ---------- */
async function startApp(){
  document.querySelector('.tabs').hidden=false;document.querySelectorAll('.tab').forEach(b=>b.disabled=false);
  Who.fromSession();const up=$('userPill');up.hidden=false;up.textContent=Who.name+(Who.sup&&Who.name!=='admin'?' · admin':'');up.title=Who.sup?'Admin':'Staff';up.onclick=()=>{if(S.ready)go('guide')};
  let P=null;
  try{P=await IDB.get('section')}catch(e){}
  if(!P){try{P=await embeddedParts()}catch(e){}}
  if(!P){showSetup();return}
  try{await loadData(P)}catch(e){showSetup('The saved data could not be read. Load the section data file again.');return}
  S.P=P;S.meta=P.meta||{};S.ready=true;bindBackButton();
  Store.loadLocal();Store.loadLocalF();if(!S.fdr||!S.fMap.has(S.fdr))S.fdr=S.feeders[0].fc;
  Store.loadLocalA();if(!S.adr||!S.aMap.has(S.adr))S.adr=S.areas[0].ac;
  if(!S.dtr&&S.dtrMap.has('1607010596'))S.dtr='1607010596';
  go('verify');
  Store.init();
  Who.init();
}
(async()=>{if(Auth.session())await startApp();else showLogin()})();
