name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME) with licences accepted
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 8

      - name: Install packages
        run: npm ci

      - name: Copy the app into the Android project
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YRG-DTR-Verify.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YRG-DTR-Verify-apk
          path: YRG-DTR-Verify.apk

      - name: Publish to the "apk" release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Android APK (latest build)" --notes "Built automatically from main. The APK has no consumer data; load YRGuda_section_data.json on first open."
          gh release upload apk YRG-DTR-Verify.apk --clobber
