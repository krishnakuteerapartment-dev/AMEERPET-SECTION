name: Publish signed APK

# The release APK is signed with the app's permanent key outside GitHub (tools/apksign.py),
# then pushed to the "signed-apk" branch. This checks that it installs and opens on an
# emulator, and publishes it as the download on the "apk" release.
on:
  push:
    branches: [signed-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and open on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/ci/check-signed.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Android APK: Ameerpet sec-DTR verify" --notes "Install Ameerpet-sec-DTR-verify.apk."
          gh release upload apk Ameerpet-sec-DTR-verify.apk --clobber
          gh release edit apk --title "Android APK: Ameerpet sec-DTR verify" --notes "Download **Ameerpet-sec-DTR-verify.apk** and install it. It is signed with the app's permanent key, so every later update installs over it and keeps the entries on the phone. This public copy has no consumer data and no Google Sheet link: use the full APK from the admin, or sign in as admin and load the section data file, or paste the Sheet link and tap Get section data from Google Sheet."
          gh release delete-asset apk DTR-Verify.apk -y || true
          gh release delete-asset apk YRG-DTR-Verify.apk -y || true
          gh release upload apk check-shots.zip --clobber || true
